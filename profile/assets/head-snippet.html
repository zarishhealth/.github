<!-- ===== ZarishHealth: favicons, PWA & social ===== -->
<!-- Assets are hot-linked from the single canonical kit in zarishhealth/.github.
     A site that needs same-origin files (the web manifest, browserconfig.xml)
     copies just those two from the kit into its own static root. -->
<!-- Favicons: 3 files cover ~every browser; the rest are progressive enhancement -->
<link rel="icon" href="https://raw.githubusercontent.com/zarishhealth/.github/main/profile/assets/favicon/zarishhealth-favicon-web.ico" sizes="32x32">
<link rel="icon" href="https://raw.githubusercontent.com/zarishhealth/.github/main/profile/assets/favicon/zarishhealth-favicon-web.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/zarishhealth/.github/main/profile/assets/app-icon/zarishhealth-appicon-ios-180x180.png">
<link rel="mask-icon" href="https://raw.githubusercontent.com/zarishhealth/.github/main/profile/assets/favicon/zarishhealth-favicon-safari-pinned-tab.svg" color="#017CF5">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#017CF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#02091C" media="(prefers-color-scheme: dark)">
<meta name="msapplication-TileColor" content="#017CF5">
<meta name="msapplication-config" content="/browserconfig.xml">

<!-- Open Graph (Facebook, LinkedIn, Slack, Discord, WhatsApp, iMessage) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZarishHealth">
<meta property="og:title" content="ZarishHealth">
<meta property="og:description" content="Open health infrastructure.">
<meta property="og:url" content="https://zarishhealth.github.io">
<meta property="og:image" content="https://raw.githubusercontent.com/zarishhealth/.github/main/profile/assets/social/zarishhealth-social-opengraph-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ZarishHealth">

<!-- X / Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ZarishHealth">
<meta name="twitter:description" content="Open health infrastructure.">
