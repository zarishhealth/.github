name: "Bug report"
about: "Create a report to help us improve"
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Do not include patient or other personal
        information, credentials, identifiable site details, or unredacted
        production logs. Use synthetic examples and redact sensitive values.
  - type: input
    id: environment
    attributes:
      label: Environment (OS, Rust/Node version, browser)
      description: e.g., operating system and software version; do not include site or patient identifiers
      placeholder: "Ubuntu 22.04, app version"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the bug
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack traces (redacted; synthetic examples only)