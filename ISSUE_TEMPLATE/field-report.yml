name: "Field report"
about: "Share a deployment observation using synthetic, non-identifying details"
title: "[field-report] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Never include patient or personal information,
        real site identifiers, private ticket links, credentials, or production
        logs. Use synthetic examples and general, non-identifying descriptions.
  - type: input
    id: environment
    attributes:
      label: General environment (optional)
      description: Use broad details only; do not identify a person, facility, or site.
      placeholder: "Rural clinic, limited connectivity"
  - type: textarea
    id: summary
    attributes:
      label: Summary of the observation (synthetic details only)
  - type: textarea
    id: actions
    attributes:
      label: Actions taken
  - type: input
    id: versions
    attributes:
      label: Relevant software versions
      description: Do not include private links, identifiers, or sensitive logs.