name: "Reusable Docs -> Pages builder"
on:
  workflow_call:
    inputs:
      docs-dir:
        type: string
        required: true
      build-command:
        type: string
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tooling
        run: |
          if [ -f package.json ]; then npm ci || true; fi
      - name: Build docs
        run: |
          if [ -n "${{ inputs.build-command }}" ]; then
            eval "${{ inputs.build-command }}"
          else
            if [ -f package.json ]; then npm run build || true; fi
          fi
      - name: Archive site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ inputs.docs-dir }}