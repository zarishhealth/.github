name: "Org Lint (YAML/Markdown)"
on:
  workflow_call:
    inputs:
      path:
        type: string
        required: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Markdown lint
        uses: davidanson/markdownlint-cli@v1
        with:
          args: "${{ inputs.path || '.' }}"
      - name: YAML check (yamllint)
        uses: norwoodj/action-yamllint@v1
        with:
          files: "${{ inputs.path || '.' }}"