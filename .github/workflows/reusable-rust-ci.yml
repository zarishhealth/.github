name: "Reusable Rust CI"
on:
  workflow_call:
    inputs:
      workdir:
        description: 'Path to crate or workspace to build (relative)'
        required: true
        type: string
      rust-toolchain:
        description: 'Rust toolchain (e.g. stable)'
        required: false
        type: string
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # TODO: pin to a full commit SHA for supply-chain security
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ inputs.rust-toolchain || 'stable' }}
      - name: Format check
        run: |
          cd ${{ inputs.workdir }}
          cargo fmt --all -- --check
      - name: Clippy
        run: |
          cd ${{ inputs.workdir }}
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: |
          cd ${{ inputs.workdir }}
          cargo test --all --release
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.job }}
          path: target/